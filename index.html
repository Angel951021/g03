<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《神奇的力》互動學習系統 - GO3 原型 v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; background-color: #EBF5FF; color: #0F172A; }
    .btn-action { transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease; }
    .btn-action:active { transform: scale(0.97); }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    .animate-float { animation: floatSlow 3s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="bg-white/90 backdrop-blur border-b border-sky-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <button onclick="navigateTo('home')" class="flex items-center gap-3 text-left group focus:outline-none">
        <div class="w-10 h-10 rounded-xl bg-sky-100 border border-sky-300 flex items-center justify-center shadow-inner group-hover:bg-sky-200 transition">
          <svg class="w-7 h-7" viewBox="0 0 64 64" fill="none">
            <ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(-30 32 32)" stroke="#475569" stroke-width="3.5"/>
            <ellipse cx="32" cy="32" rx="26" ry="10" transform="rotate(30 32 32)" stroke="#475569" stroke-width="3.5"/>
            <ellipse cx="32" cy="32" rx="26" ry="10" stroke="#475569" stroke-width="3.5"/>
            <circle cx="32" cy="32" r="8" fill="#EF4444"/>
            <circle cx="14" cy="18" r="4.5" fill="#F59E0B"/>
            <circle cx="50" cy="46" r="4.5" fill="#3B82F6"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-black text-lg sm:text-xl text-slate-900 tracking-tight">神奇的力</span>
            <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-sky-100 text-sky-800">GO3 原型 v2</span>
          </div>
          <p class="text-xs text-slate-500">互動學習系統</p>
        </div>
      </button>

      <div class="flex items-center gap-2 sm:gap-3">
        <div class="hidden sm:flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl text-xs font-bold">
          <span id="nav-badge-u1" class="px-2 py-0.5 rounded-lg bg-slate-200 text-slate-600">1. 力的種類</span>
          <span class="text-slate-400">→</span>
          <span id="nav-badge-u2" class="px-2 py-0.5 rounded-lg bg-slate-200 text-slate-600">2. 摩擦力</span>
          <span class="text-slate-400">→</span>
          <span id="nav-badge-u3" class="px-2 py-0.5 rounded-lg bg-slate-200 text-slate-600">3. 互動遊戲</span>
        </div>
        <button onclick="toggleFlowModal(true)" class="btn-action px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs sm:text-sm font-bold shadow">
          系統流程
        </button>
      </div>
    </div>
  </header>

  <main id="app-main" class="flex-1 max-w-5xl w-full mx-auto px-4 py-6"></main>

  <footer class="bg-white border-t border-sky-200 py-4 px-4 mt-8">
    <div class="max-w-5xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-600">
      <div>組別：<strong>G03</strong>（何冠璇、劉家妤、詹依璇、黃彥祖、邱子恩）｜專題原型</div>
      <div class="flex flex-wrap items-center gap-1.5">
        <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 font-bold">已審查知識</span>
        <span>依據《GO3 企劃書》《流程圖》《知識文件：摩擦力與動物爬樹的秘密》｜未載明處標示</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 font-bold">待確認</span>
      </div>
    </div>
  </footer>

  <div id="flow-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-black text-slate-900">《神奇的力》系統流程狀態</h3>
        <button onclick="toggleFlowModal(false)" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm">關閉</button>
      </div>
      <div id="flow-modal-body" class="space-y-3 text-sm"></div>
    </div>
  </div>

  <script>
    const appState = {
      currentView: 'home',
      completed: { unit1: false, unit2: false, unit3: false },
      history: { u1Attempts: 0, u2Attempts: 0, u3Task1Done: false, u3Task2Done: false, u3QuizAttempts: 0 },
      u1: { step: 'intro', answers: { spring: '', friction: '', magnet: '', gravity: '' }, feedback: null },
      u2: { step: 'concept', frictionResistance: 50, materialName: '抹布（中等粗糙）', selectedDir: '', feedback: null },
      u3: {
        step: 'task1',
        task1Selections: { down: '', left: '', right: '', up: '' },
        task1Feedback: null,
        task2: { prediction: '', force: 60, frictionResistance: 20, materialName: 'PP板（光滑）', observed: false, resultText: '' },
        quizAnswers: {},
        quizFeedback: null
      }
    };

    let activeAnimFrame = null;
    function stopCanvasAnim() {
      if (activeAnimFrame) { cancelAnimationFrame(activeAnimFrame); activeAnimFrame = null; }
    }

    function navigateTo(view) {
      stopCanvasAnim();
      appState.currentView = view;
      updateTopBadges();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateTopBadges() {
      const b1 = document.getElementById('nav-badge-u1');
      const b2 = document.getElementById('nav-badge-u2');
      const b3 = document.getElementById('nav-badge-u3');
      b1.className = appState.completed.unit1 ? 'px-2 py-0.5 rounded-lg bg-rose-500 text-white' : 'px-2 py-0.5 rounded-lg bg-slate-200 text-slate-600';
      b2.className = appState.completed.unit2 ? 'px-2 py-0.5 rounded-lg bg-sky-600 text-white' : 'px-2 py-0.5 rounded-lg bg-slate-200 text-slate-600';
      b3.className = appState.completed.unit3 ? 'px-2 py-0.5 rounded-lg bg-emerald-600 text-white' : 'px-2 py-0.5 rounded-lg bg-slate-200 text-slate-600';
    }

    function toggleFlowModal(show) {
      const modal = document.getElementById('flow-modal');
      const body = document.getElementById('flow-modal-body');
      if (show) {
        const allDone = appState.completed.unit1 && appState.completed.unit2 && appState.completed.unit3;
        body.innerHTML = `
          <div class="p-3 rounded-xl bg-sky-50 border border-sky-200 font-bold text-sky-900">起點：開啟「神奇的力」學習系統 → 首頁選擇單元</div>
          <div class="grid grid-cols-1 gap-2">
            <div class="p-3 rounded-xl border ${appState.completed.unit1 ? 'bg-rose-50 border-rose-300' : 'bg-slate-50 border-slate-200'} flex justify-between items-center">
              <span class="font-bold">一、力的種類介紹</span>
              <span class="text-xs font-black px-2.5 py-1 rounded-lg ${appState.completed.unit1 ? 'bg-rose-500 text-white' : 'bg-slate-200 text-slate-600'}">${appState.completed.unit1 ? '已完成' : '未完成'}</span>
            </div>
            <div class="p-3 rounded-xl border ${appState.completed.unit2 ? 'bg-sky-50 border-sky-300' : 'bg-slate-50 border-slate-200'} flex justify-between items-center">
              <span class="font-bold">二、摩擦力登場</span>
              <span class="text-xs font-black px-2.5 py-1 rounded-lg ${appState.completed.unit2 ? 'bg-sky-600 text-white' : 'bg-slate-200 text-slate-600'}">${appState.completed.unit2 ? '已完成' : '未完成'}</span>
            </div>
            <div class="p-3 rounded-xl border ${appState.completed.unit3 ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200'} flex justify-between items-center">
              <span class="font-bold">三、動手操作（互動遊戲）</span>
              <span class="text-xs font-black px-2.5 py-1 rounded-lg ${appState.completed.unit3 ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-600'}">${appState.completed.unit3 ? '已完成' : '未完成'}</span>
            </div>
          </div>
          <div class="p-3 rounded-xl border ${allDone ? 'bg-amber-50 border-amber-300 text-amber-900' : 'bg-slate-100 border-slate-200 text-slate-600'} font-bold">
            條件判斷（三個單元是否皆完成？）：${allDone ? '是 → 可領取「力學小達人」勳章！' : '否 → 返回首頁繼續完成單元'}
          </div>
        `;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function renderApp() {
      const main = document.getElementById('app-main');
      switch (appState.currentView) {
        case 'home': main.innerHTML = renderHomeView(); break;
        case 'unit1': main.innerHTML = renderUnit1View(); break;
        case 'unit2':
          main.innerHTML = renderUnit2View();
          if (appState.u2.step === 'sim') initUnit2Canvas();
          break;
        case 'unit3':
          main.innerHTML = renderUnit3View();
          if (appState.u3.step === 'task2') initUnit3Task2Canvas();
          break;
        case 'result': main.innerHTML = renderResultView(); break;
      }
    }

    function renderHomeView() {
      const { unit1, unit2, unit3 } = appState.completed;
      const allDone = unit1 && unit2 && unit3;
      return `
        <div class="space-y-6">
          <section class="bg-white rounded-2xl p-6 sm:p-8 shadow-sm border border-sky-200 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="space-y-3 max-w-xl">
              <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-sky-100 text-sky-800 text-xs font-bold">
                <span>視覺化力學學習</span><span>•</span><span>動態向量箭頭</span>
              </div>
              <h1 class="text-2xl sm:text-3xl font-black text-slate-900">歡迎來到《神奇的力》</h1>
              <p class="text-slate-600 text-sm sm:text-base leading-relaxed">力無法直接看見！結合「動物爬樹的秘密」生活情境與動態向量箭頭，一起觀察力的種類、方向與摩擦力變化。</p>
              <div class="pt-1 flex flex-wrap gap-2">
                <span class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-semibold">1. 具象化向量箭頭</span>
                <span class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-semibold">2. 接觸面材質實驗</span>
                <span class="text-xs px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 font-semibold">3. 任務化受力標示</span>
              </div>
            </div>
            <div class="w-36 h-36 sm:w-44 sm:h-44 rounded-2xl bg-sky-50 border border-sky-200 flex items-center justify-center shrink-0 animate-float">
              <svg class="w-28 h-28" viewBox="0 0 120 120" fill="none">
                <path d="M22 45 V75 M14 67 L22 76 L30 67" stroke="#EF4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M98 40 V70 M90 62 L98 71 L106 62" stroke="#EF4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                <line x1="48" y1="12" x2="48" y2="28" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
                <line x1="60" y1="8" x2="60" y2="24" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
                <line x1="72" y1="14" x2="72" y2="30" stroke="#0F172A" stroke-width="3" stroke-linecap="round"/>
                <path d="M60 36 C50 32, 42 40, 44 52 C46 62, 54 66, 60 63 C66 66, 74 62, 76 52 C78 40, 70 32, 60 36 Z" fill="#F87171" stroke="#0F172A" stroke-width="3"/>
                <path d="M60 35 L62 27" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
                <ellipse cx="67" cy="29" rx="5" ry="2.5" transform="rotate(-20 67 29)" fill="#4ADE80" stroke="#0F172A" stroke-width="2"/>
                <path d="M20 105 A45 45 0 0 1 100 105" fill="#60A5FA" stroke="#0F172A" stroke-width="3"/>
                <path d="M45 92 Q55 96 52 105 L35 105 Q38 95 45 92 Z" fill="#86EFAC"/>
                <path d="M72 88 Q82 94 78 105 L65 105 Q66 93 72 88 Z" fill="#86EFAC"/>
              </svg>
            </div>
          </section>

          <section>
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-lg font-black text-slate-900">請選擇學習單元</h2>
              <span class="text-xs font-bold text-slate-500">完成進度：${[unit1, unit2, unit3].filter(Boolean).length} / 3 單元</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="bg-white rounded-2xl p-5 border-2 ${unit1 ? 'border-rose-400' : 'border-slate-200'} shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="px-3 py-1 rounded-xl bg-rose-500 text-white text-xs font-black">一、力的種類介紹</span>
                    <span class="text-xs font-bold ${unit1 ? 'text-rose-600' : 'text-slate-400'}">${unit1 ? '✓ 已完成' : '未完成'}</span>
                  </div>
                  <h3 class="text-lg font-extrabold text-slate-900 mb-1">接觸力與非接觸力</h3>
                  <p class="text-sm text-slate-600 mb-4">認識碰觸才有效的力與隔空作用的力，並完成分類小測試。</p>
                </div>
                <button onclick="startUnit1()" class="btn-action w-full py-3 px-4 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-bold text-sm shadow">${unit1 ? '再次複習' : '進入單元一'}</button>
              </div>

              <div class="bg-white rounded-2xl p-5 border-2 ${unit2 ? 'border-sky-500' : 'border-slate-200'} shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="px-3 py-1 rounded-xl bg-sky-600 text-white text-xs font-black">二、摩擦力登場</span>
                    <span class="text-xs font-bold ${unit2 ? 'text-sky-600' : 'text-slate-400'}">${unit2 ? '✓ 已完成' : '未完成'}</span>
                  </div>
                  <h3 class="text-lg font-extrabold text-slate-900 mb-1">接觸面材質與運動方向</h3>
                  <p class="text-sm text-slate-600 mb-4">切換不同材質地板觀察滑行距離，並挑戰摩擦力方向判斷。</p>
                </div>
                <button onclick="startUnit2()" class="btn-action w-full py-3 px-4 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-bold text-sm shadow">${unit2 ? '再次複習' : '進入單元二'}</button>
              </div>

              <div class="bg-white rounded-2xl p-5 border-2 ${unit3 ? 'border-emerald-500' : 'border-slate-200'} shadow-sm flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <span class="px-3 py-1 rounded-xl bg-emerald-600 text-white text-xs font-black">三、動手操作</span>
                    <span class="text-xs font-bold ${unit3 ? 'text-emerald-600' : 'text-slate-400'}">${unit3 ? '✓ 已完成' : '未完成'}</span>
                  </div>
                  <h3 class="text-lg font-extrabold text-slate-900 mb-1">互動遊戲與迷思挑戰</h3>
                  <p class="text-sm text-slate-600 mb-4">標示木塊受力、調整施力（gw）與接觸面材質，完成錯誤概念挑戰。</p>
                </div>
                <button onclick="startUnit3()" class="btn-action w-full py-3 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow">${unit3 ? '再次挑戰' : '進入單元三'}</button>
              </div>
            </div>
          </section>

          <section class="bg-white rounded-2xl p-5 border ${allDone ? 'border-amber-400 bg-amber-50/60' : 'border-slate-200'} flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl ${allDone ? 'bg-amber-400 text-white' : 'bg-slate-200 text-slate-500'} flex items-center justify-center font-black text-xl shrink-0">★</div>
              <div>
                <h3 class="font-black text-slate-900">${allDone ? '恭喜！三個單元皆已完成！' : '完成三個單元即可解鎖「力學小達人」勳章'}</h3>
                <p class="text-xs sm:text-sm text-slate-600">${allDone ? '點擊右側按鈕彙整學習歷程並領取結果頁勳章。' : '目前尚有單元未完成，請先點選上方單元進行學習。'}</p>
              </div>
            </div>
            <button onclick="${allDone ? "navigateTo('result')" : "showHomeIncompleteHint()"}" class="btn-action px-6 py-3 rounded-xl font-black text-sm shrink-0 ${allDone ? 'bg-amber-500 hover:bg-amber-600 text-white shadow-md' : 'bg-slate-200 text-slate-500 cursor-pointer'}">
              ${allDone ? '查看結果與領取勳章 →' : '尚未解鎖勳章'}
            </button>
          </section>
          <div id="home-hint-box" class="hidden p-3 rounded-xl bg-amber-100 border border-amber-300 text-amber-900 text-sm font-bold text-center">
            流程提示：三個單元尚未全部完成，請先完成所有標示「未完成」的單元！
          </div>
        </div>
      `;
    }

    function showHomeIncompleteHint() {
      const box = document.getElementById('home-hint-box');
      if (box) box.classList.remove('hidden');
    }

    function startUnit1() { appState.u1.step = 'intro'; appState.u1.feedback = null; navigateTo('unit1'); }

    function renderUnit1View() {
      const { step, answers, feedback } = appState.u1;
      return `
        <div class="space-y-5">
          <div class="bg-rose-500 text-white rounded-2xl p-5 shadow-sm flex flex-wrap items-center justify-between gap-3">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider bg-white/20 px-2.5 py-0.5 rounded-lg">階段一</span>
              <h1 class="text-xl sm:text-2xl font-black mt-1">一、力的種類介紹</h1>
            </div>
            <button onclick="navigateTo('home')" class="btn-action px-4 py-2 rounded-xl bg-white/20 hover:bg-white/30 text-white text-sm font-bold">← 返回首頁</button>
          </div>

          ${step === 'intro' ? `
            <div class="bg-white rounded-2xl p-6 border border-slate-200 space-y-5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h2 class="text-lg font-black text-slate-900">系統展示：接觸力與非接觸力</h2>
                <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800">來源：企劃書第 6 頁 ＋ 知識文件</span>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="p-5 rounded-2xl bg-rose-50 border-2 border-rose-200 space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="text-lg font-black text-rose-700">接觸力</span>
                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-rose-200 text-rose-900">必須碰觸</span>
                  </div>
                  <p class="text-base font-bold text-slate-800">必須碰觸才有效。</p>
                  <div class="bg-white p-3 rounded-xl border border-rose-100 text-sm text-slate-700 space-y-1">
                    <p><strong>基本範例：</strong>彈力、摩擦力</p>
                    <p><strong>生活情境（知識文件）：</strong>彈簧受力形變（彈力）；穿山甲爪子抓樹幹爬樹、吸管卡住棉線、抹布／砂紙／PP板斜坡滑行（摩擦力）。</p>
                  </div>
                </div>
                <div class="p-5 rounded-2xl bg-sky-50 border-2 border-sky-200 space-y-3">
                  <div class="flex items-center justify-between">
                    <span class="text-lg font-black text-sky-700">非接觸力</span>
                    <span class="text-xs font-bold px-2 py-0.5 rounded bg-sky-200 text-sky-900">隔空作用</span>
                  </div>
                  <p class="text-base font-bold text-slate-800">隔空就能發揮作用。</p>
                  <div class="bg-white p-3 rounded-xl border border-sky-100 text-sm text-slate-700 space-y-1">
                    <p><strong>基本範例：</strong>磁力、重力</p>
                    <p><strong>生活情境（知識文件）：</strong>強力磁鐵掛鉤吸住物體（磁力）；物體與爬樹動物皆受「地球引力（重力）」向下作用。</p>
                  </div>
                </div>
              </div>
              <div class="pt-2 flex justify-end">
                <button onclick="goUnit1Quiz()" class="btn-action px-6 py-3 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-black text-sm shadow">下一步：進行種類分類小測試 →</button>
              </div>
            </div>
          ` : ''}

          ${step === 'quiz' ? `
            <div class="bg-white rounded-2xl p-6 border border-slate-200 space-y-5">
              <div>
                <h2 class="text-lg font-black text-slate-900">種類分類小測試</h2>

    function initUnit2Canvas() {
      const canvas = document.getElementById('u2-canvas');
      const wrap = document.getElementById('u2-canvas-wrap');
      if (!canvas || !wrap) return;
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = wrap.clientWidth; canvas.height = wrap.clientHeight; }
      resize(); window.addEventListener('resize', resize);

      function drawArrow(fromX, fromY, toX, toY, color, label) {
        const headlen = 10, angle = Math.atan2(toY - fromY, toX - fromX);
        ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.closePath(); ctx.fill();
        ctx.font = 'bold 12px "Noto Sans TC", sans-serif';
        ctx.fillText(label, Math.min(fromX, toX), fromY - 10);
        ctx.restore();
      }

      function loop() {
        if (appState.currentView !== 'unit2' || appState.u2.step !== 'sim') return;
        const w = canvas.width, h = canvas.height, floorY = h - 42, resist = appState.u2.frictionResistance;
        if (u2SimState.moving) {
          u2SimState.x += u2SimState.vx;
          const decel = 0.02 + (resist / 100) * 0.14;
          u2SimState.vx = Math.max(0, u2SimState.vx - decel);
          if (u2SimState.x > w - 95) { u2SimState.x = w - 95; u2SimState.vx = 0; }
          if (u2SimState.vx <= 0.01) { u2SimState.vx = 0; u2SimState.moving = false; }
        }
        const badge = document.getElementById('u2-speed-badge');
        const distCm = Math.max(0, Math.round((u2SimState.x - 50) / 5));
        if (badge) badge.textContent = u2SimState.moving ? `滑行中｜目前距離：${distCm} cm（阻力 ${resist} gw）` : `已停止｜總滑行距離：${distCm} cm`;

        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#E2E8F0'; ctx.fillRect(0, floorY, w, h - floorY);
        ctx.fillStyle = '#64748B';
        const step = Math.max(8, 36 - Math.floor(resist * 0.3));
        for (let gx = 10; gx < w; gx += step) {
          ctx.beginPath(); ctx.arc(gx, floorY + 5, resist > 60 ? 2.5 : 1.5, 0, Math.PI * 2); ctx.fill();
        }
        const bx = u2SimState.x, by = floorY - 46;
        ctx.fillStyle = '#2563EB'; ctx.beginPath(); ctx.roundRect(bx, by, 70, 46, 8); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 13px "Noto Sans TC", sans-serif'; ctx.fillText('木塊', bx + 21, by + 28);

        if (u2SimState.moving && u2SimState.vx > 0) {
          const cx = bx + 35, cy = by + 23;
          drawArrow(cx + 35, cy - 12, cx + 35 + u2SimState.vx * 8, cy - 12, '#0284C7', '運動方向 →');
          const fLen = 25 + resist * 0.55;
          drawArrow(cx - 35, cy + 12, cx - 35 - fLen, cy + 12, '#DC2626', `← 摩擦力 (${resist} gw)`);
        }
        activeAnimFrame = requestAnimationFrame(loop);
      }
      loop();
    }

        if (appState.currentView !== 'unit3' || appState.u3.step !== 'task2') return;
        const w = canvas.width, h = canvas.height, floorY = h - 36, { force, frictionResistance } = appState.u3.task2;
        if (u3SimState.running) {

          if (net > 5) { u3SimState.vx = Math.min(6, u3SimState.vx + net * 0.004); u3SimState.x += u3SimState.vx; }
          else if (net >= -5) { u3SimState.vx = 1.2; u3SimState.x += u3SimState.vx; }
          else { u3SimState.vx = 0; }
          if (u3SimState.x > w - 90) { u3SimState.x = w - 90; u3SimState.running = false; }
        }
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#CBD5E1'; ctx.fillRect(0, floorY, w, h - floorY);
        const bx = u3SimState.x, by = floorY - 42;
        ctx.fillStyle = '#059669'; ctx.beginPath(); ctx.roundRect(bx, by, 64, 42, 8); ctx.fill();
        ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 12px "Noto Sans TC", sans-serif'; ctx.fillText('木塊', bx + 19, by + 25);

        const fLen = 20 + force * 0.6, rLen = 20 + frictionResistance * 0.6;
        ctx.strokeStyle = '#0284C7'; ctx.fillStyle = '#0369A1'; ctx.lineWidth = 4;

        ctx.font = 'bold 11px "Noto Sans TC", sans-serif'; ctx.fillText(`施力 ${force} gw →`, bx + 68, by + 12);

        ctx.strokeStyle = '#DC2626'; ctx.fillStyle = '#B91C1C';

        ctx.fillText(`← 阻力 ${frictionResistance} gw`, Math.max(8, bx - rLen), by + 12);

      renderApp();
    }

    function goUnit3Quiz() { stopCanvasAnim(); appState.u3.step = 'quiz'; renderApp(); }

    function renderMisconceptionRow(key, question, val) {
      return `
        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
          <span class="font-bold text-sm text-slate-900">${question}</span>
          <div class="flex gap-2 shrink-0">
            <button onclick="appState.u3.quizAnswers['${key}']='yes'; renderApp();" class="btn-action px-4 py-1.5 rounded-xl text-xs font-black border ${val === 'yes' ? 'bg-rose-500 text-white border-rose-600' : 'bg-white text-slate-700 border-slate-300'}">是（正確觀念）</button>
            <button onclick="appState.u3.quizAnswers['${key}']='no'; renderApp();" class="btn-action px-4 py-1.5 rounded-xl text-xs font-black border ${val === 'no' ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-white text-slate-700 border-slate-300'}">否（這是迷思）</button>
          </div>
        </div>
      `;
    }

    function checkUnit3Quiz() {
      const q = appState.u3.quizAnswers;
      if (!q.m1 || !q.m2 || !q.m3 || !q.m4 || !q.m5) {
        appState.u3.quizFeedback = { ok: false, message: '請先完成全部 5 題迷思問答的作答！' }; renderApp(); return;
      }
      appState.history.u3QuizAttempts += 1;
      if (q.m1 === 'no' && q.m2 === 'no' && q.m3 === 'no' && q.m4 === 'no' && q.m5 === 'no') {
        appState.completed.unit3 = true; updateTopBadges(); appState.u3.step = 'summary'; renderApp();
      } else {
        appState.u3.quizFeedback = { ok: false, message: '還有題目未破除迷思喔！提示：企劃書第 9 頁列出的這 5 句話都是常見的「錯誤概念」，請將它們全部選為「否（這是迷思）」。' };
        renderApp();
      }
    }

    function renderResultView() {
      const h = appState.history;
      return `
        <div class="bg-white rounded-3xl p-6 sm:p-10 border-2 border-amber-400 shadow-lg text-center space-y-6">
          <div class="inline-flex items-center px-4 py-1.5 rounded-full bg-amber-100 text-amber-900 text-xs font-black">三個單元皆已完成 • 學習歷程彙整</div>
          <div class="flex justify-center">
            <div class="w-36 h-36 rounded-full bg-gradient-to-b from-amber-300 to-amber-500 p-2 shadow-xl flex items-center justify-center animate-float">
              <div class="w-full h-full rounded-full bg-white flex flex-col items-center justify-center border-4 border-amber-400">
                <span class="text-4xl">🏆</span><span class="text-sm font-black text-amber-800 mt-1">力學小達人</span>
              </div>
            </div>
          </div>
          <div class="space-y-2">
            <h1 class="text-2xl sm:text-3xl font-black text-slate-900">恭喜獲得「力學小達人」勳章！</h1>
            <p class="text-sm text-slate-600">您已完成《神奇的力》全部互動學習單元與迷思挑戰。</p>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-left max-w-3xl mx-auto">
            <div class="p-4 rounded-2xl bg-rose-50 border border-rose-200">
              <p class="text-xs font-bold text-rose-700">單元一：力的種類介紹</p>
              <p class="text-lg font-black text-slate-900 mt-1">✓ 通過分類測試</p>
              <p class="text-xs text-slate-600 mt-1">測試作答次數：${h.u1Attempts} 次</p>
            </div>
            <div class="p-4 rounded-2xl bg-sky-50 border border-sky-200">
              <p class="text-xs font-bold text-sky-700">單元二：摩擦力登場</p>
              <p class="text-lg font-black text-slate-900 mt-1">✓ 通過方向挑戰</p>
              <p class="text-xs text-slate-600 mt-1">方向挑戰次數：${h.u2Attempts} 次</p>
            </div>
            <div class="p-4 rounded-2xl bg-emerald-50 border border-emerald-200">
              <p class="text-xs font-bold text-emerald-700">單元三：動手操作</p>
              <p class="text-lg font-black text-slate-900 mt-1">✓ 完成全數任務</p>
              <p class="text-xs text-slate-600 mt-1">迷思問答次數：${h.u3QuizAttempts} 次</p>
            </div>
          </div>
          <div class="pt-4 flex flex-wrap justify-center gap-3">
            <button onclick="navigateTo('home')" class="btn-action px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-black text-sm">返回首頁</button>
            <button onclick="resetAllProgress()" class="btn-action px-6 py-3 rounded-xl bg-amber-100 hover:bg-amber-200 text-amber-900 font-black text-sm">重新體驗系統</button>
          </div>
        </div>
      `;
    }

    function resetAllProgress() {
      appState.completed = { unit1: false, unit2: false, unit3: false };
      appState.history = { u1Attempts: 0, u2Attempts: 0, u3Task1Done: false, u3Task2Done: false, u3QuizAttempts: 0 };
      appState.u1 = { step: 'intro', answers: { spring: '', friction: '', magnet: '', gravity: '' }, feedback: null };
      appState.u2 = { step: 'concept', frictionResistance: 50, materialName: '抹布（中等粗糙）', selectedDir: '', feedback: null };
      appState.u3 = {
        step: 'task1', task1Selections: { down: '', left: '', right: '', up: '' }, task1Feedback: null,
        task2: { prediction: '', force: 60, frictionResistance: 20, materialName: 'PP板（光滑）', observed: false, resultText: '' },
        quizAnswers: {}, quizFeedback: null
      };
      navigateTo('home');
    }

    document.addEventListener('DOMContentLoaded', function () {
      updateTopBadges();
      renderApp();
    });
  </script>
</body>
</html>
